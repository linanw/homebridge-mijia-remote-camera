name: Public source CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-source:
    name: Node ${{ matrix.node }} / Homebridge ${{ matrix.homebridge }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.13.1', '22.x', '24.x']
        homebridge: ['1.11.4', '2.4.0']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install pinned public dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Select Homebridge compatibility target
        run: npm install --no-save --package-lock=false --ignore-scripts homebridge@${{ matrix.homebridge }}
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Confirm private assets are absent
        run: test ! -e assets
      - name: Run tests with explicit component-dependent skips
        run: npm test
      - name: Check published file boundary
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { spawnSync } from 'node:child_process';
          const packed = spawnSync('npm', ['pack', '--dry-run', '--json', '--ignore-scripts'], { encoding: 'utf8' });
          if (packed.status !== 0) throw new Error('npm pack dry-run failed');
          const files = JSON.parse(packed.stdout)[0].files.map(file => file.path);
          const forbidden = files.filter(file => /(^|\/)(assets|node_modules|\.micam|matter|build)(\/|$)/.test(file)
            || /(^|\/)(credentials|selection|region)\.json$/.test(file)
            || /\.(apk|dex|tgz)$/.test(file)
            || (/\.(jar|so|dll|exe)$/.test(file) && file !== 'backend/bridge.jar'));
          if (forbidden.length) throw new Error(`Unexpected package files: ${forbidden.join(', ')}`);
          if (!files.includes('backend/bridge.jar')) throw new Error('Original Java adapter is missing');
          console.log(`Checked ${files.length} package files; no imported runtime or account files`);
          JS
